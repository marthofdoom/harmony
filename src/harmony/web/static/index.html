<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harmony</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav id="sidebar">
    <div class="brand"><span class="logo">🎵</span> Harmony</div>
    <ul id="nav">
      <li data-view="search" class="active">🔍 Search</li>
      <li data-view="playlists">≣ Playlists</li>
      <li class="disabled">✧ Discover</li>
      <li data-view="sync">⟳ Sync</li>
      <li class="disabled">📻 Devices</li>
      <li data-view="accounts">👤 Accounts</li>
    </ul>
    <div id="accounts" title="Manage accounts"></div>
  </nav>

  <section id="content">
    <div id="topbar">
      <h2 id="view-title">Search</h2>
      <form id="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search songs, playlists…" />
      </form>
    </div>
    <div id="list"><p class="hint">Search for a song, or open your playlists.</p></div>
  </section>

  <footer id="nowplaying" class="empty">
    <img id="np-art" alt="" />
    <div id="np-meta">
      <div id="np-title">Nothing playing</div>
      <div id="np-artist"></div>
    </div>
    <div id="np-transport">
      <button id="np-prev" title="Previous">⏮</button>
      <button id="np-play" class="play" title="Play/Pause">▶</button>
      <button id="np-next" title="Next">⏭</button>
    </div>
    <div id="np-seekwrap">
      <span class="time" id="np-pos">0:00</span>
      <input id="np-seek" type="range" min="0" max="1" step="1" value="0" />
      <span class="time" id="np-dur">0:00</span>
    </div>
    <input id="np-vol" type="range" min="0" max="100" value="100" title="Volume" />
    <select id="np-device" title="Play to"><option value="browser">This browser</option></select>
    <audio id="audio"></audio>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
