<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Harmony</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#3a6fd8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Harmony" />
</head>
<body>
  <!-- Inline monochrome icon set (currentColor); referenced via <use>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-playlists" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h9M18 12v7"/><circle cx="20" cy="19" r="2"/></symbol>
      <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.5-4"/><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.5 4"/><path d="M20 3v5h-5M4 21v-5h5"/></symbol>
      <symbol id="i-devices" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="14" r="3.5"/><path d="M12 7h.01"/></symbol>
      <symbol id="i-accounts" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5v14L9 12zM6 5v14" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l10-7zM18 5v14" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-remove" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-cast" viewBox="0 0 24 24"><path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M2 12a6 6 0 0 1 6 6M2 16a2 2 0 0 1 2 2"/><path d="M2 20h.01"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/><path d="M12 7h.01"/></symbol>
      <symbol id="i-computer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
    </defs>
  </svg>

  <nav id="sidebar">
    <div class="brand"><svg class="logo"><use href="#i-music"></use></svg> Harmony</div>
    <ul id="nav" role="tablist">
      <li data-view="search" class="active" tabindex="0" role="tab"><svg class="ico"><use href="#i-search"></use></svg> Search</li>
      <li data-view="playlists" tabindex="0" role="tab"><svg class="ico"><use href="#i-playlists"></use></svg> Playlists</li>
      <li data-view="sync" tabindex="0" role="tab"><svg class="ico"><use href="#i-sync"></use></svg> Sync</li>
      <li data-view="devices" tabindex="0" role="tab"><svg class="ico"><use href="#i-devices"></use></svg> Devices</li>
      <li data-view="accounts" tabindex="0" role="tab"><svg class="ico"><use href="#i-accounts"></use></svg> Accounts</li>
    </ul>
    <button id="accounts" title="Manage accounts">Accounts</button>
  </nav>

  <section id="content">
    <div id="topbar">
      <h1 id="view-title">Search</h1>
      <form id="search" autocomplete="off" role="search">
        <input id="search-input" type="search" placeholder="Search songs, playlists…" aria-label="Search songs and playlists" />
      </form>
    </div>
    <div id="list"><p class="hint">Search for a song, or open your playlists.</p></div>
  </section>

  <footer id="nowplaying" class="empty">
    <div id="np-art" aria-hidden="true"></div>
    <div id="np-meta">
      <div id="np-title">Nothing playing</div>
      <div id="np-artist"></div>
      <div id="np-via"><svg class="ico" style="width:.9rem;height:.9rem"><use href="#i-cast"></use></svg><span></span></div>
    </div>
    <div id="np-transport">
      <button id="np-prev" aria-label="Previous track"><svg class="ico"><use href="#i-prev"></use></svg></button>
      <button id="np-play" class="play" aria-label="Play"><svg class="ico"><use href="#i-play"></use></svg></button>
      <button id="np-next" aria-label="Next track"><svg class="ico"><use href="#i-next"></use></svg></button>
    </div>
    <div id="np-seekwrap">
      <span class="time" id="np-pos">0:00</span>
      <input id="np-seek" type="range" min="0" max="1" step="1" value="0" aria-label="Seek" />
      <span class="time" id="np-dur">0:00</span>
    </div>
    <input id="np-vol" type="range" min="0" max="100" value="100" aria-label="Volume" />
    <select id="np-device" aria-label="Playback device"><option value="browser">This browser</option></select>
    <audio id="audio"></audio>
  </footer>

  <nav id="mobilenav" aria-label="Primary">
    <button data-view="search"><svg class="ico"><use href="#i-search"></use></svg><span class="l">Search</span></button>
    <button data-view="playlists"><svg class="ico"><use href="#i-playlists"></use></svg><span class="l">Playlists</span></button>
    <button data-view="sync"><svg class="ico"><use href="#i-sync"></use></svg><span class="l">Sync</span></button>
    <button data-view="devices"><svg class="ico"><use href="#i-devices"></use></svg><span class="l">Devices</span></button>
    <button data-view="accounts"><svg class="ico"><use href="#i-accounts"></use></svg><span class="l">Accounts</span></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
