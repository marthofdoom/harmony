name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: ruff check
        run: ruff check src tests

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite is deliberately offline — no provider or LLM calls — so
      # the GTK stack is not needed here. The UI smoke job below covers that.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ai,dev]"

      - name: Run tests
        run: python -m pytest -q --junitxml=junit-${{ matrix.python-version }}.xml

      # The engine has to serve both the GTK desktop app and a hosted web
      # service, so it must import on a box with no GTK at all. This runner has
      # none installed, which makes the check genuine rather than simulated.
      - name: Prove the engine imports without GTK
        run: |
          python - <<'PY'
          import sys

          class Blocked:
              def __getattr__(self, name):
                  raise ImportError("gi is deliberately unavailable in this check")

          sys.modules["gi"] = Blocked()

          import harmony.ai.claude          # noqa: F401
          import harmony.db                 # noqa: F401
          import harmony.enrich.recommender # noqa: F401
          import harmony.io_formats         # noqa: F401
          import harmony.matching           # noqa: F401
          import harmony.models             # noqa: F401
          import harmony.providers          # noqa: F401
          import harmony.sync               # noqa: F401
          import harmony.tasks              # noqa: F401
          print("engine imports cleanly with no GTK present")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  ui-smoke:
    name: GTK import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyGObject is a compiled binding against the system GTK, so it comes
      # from apt rather than pip; the venv is created with system site-packages
      # for the same reason the README tells contributors to do it locally.
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-1 libadwaita-1-0 xvfb

      - name: Create venv with system site-packages
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[ai,dev]"

      - name: Verify GTK bindings are importable
        run: |
          .venv/bin/python - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, Gtk
          print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())
          print("Adw", Adw.MAJOR_VERSION, Adw.MINOR_VERSION)
          PY

      - name: Import every UI module under a virtual display
        run: |
          xvfb-run -a .venv/bin/python - <<'PY'
          import importlib
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")

          modules = [
              "harmony.ui.state",
              "harmony.ui.widgets",
              "harmony.ui.window",
              "harmony.ui.search_page",
              "harmony.ui.playlists_page",
              "harmony.ui.sync_page",
              "harmony.ui.discover_page",
              "harmony.ui.audio_route_page",
              "harmony.ui.now_playing_bar",
              "harmony.ui.prefs",
              "harmony.app",
              "harmony.__main__",
          ]
          for name in modules:
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: Construct the application window
        run: |
          xvfb-run -a .venv/bin/python - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import GLib

          from harmony.app import HarmonyApplication

          app = HarmonyApplication()
          seen = {}

          def inspect():
              # Runs after the default `activate` handler has built the window,
              # so an empty window list means construction blew up.
              seen["windows"] = len(app.get_windows())
              app.quit()
              return GLib.SOURCE_REMOVE

          app.connect("activate", lambda _a: GLib.idle_add(inspect))
          app.run([])

          if not seen.get("windows"):
              raise SystemExit("activate produced no window")
          print(f"application constructed {seen['windows']} window(s) and shut down cleanly")
          PY

      - name: Run the full test suite with GTK present
        # The offline `test` matrix runs on multiple Pythons with no GTK, so it
        # skips the PyGObject-dependent tests (Devices/AppState). This runner
        # has GTK, so it actually executes them.
        run: xvfb-run -a .venv/bin/python -m pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
