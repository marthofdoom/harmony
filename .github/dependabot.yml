version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # ytmusicapi tracks an undocumented endpoint and the Qobuz client tracks a
  # private one, so dependency bumps here are worth reviewing rather than
  # batching blindly.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
