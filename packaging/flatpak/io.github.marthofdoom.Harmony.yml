# Flatpak manifest for Harmony.
#
# WebKitGTK (for the planned embedded Qobuz login) is provided by the GNOME
# runtime — WebKit-6.0.typelib and libwebkitgtk-6.0 ship in org.gnome.Platform,
# so the login webview needs no extra module and no user-installed dependency.
#
# Build:  flatpak run org.flatpak.Builder --force-clean --user --install \
#             build-dir packaging/flatpak/io.github.marthofdoom.Harmony.yml
# (see packaging/flatpak/build.sh)
app-id: io.github.marthofdoom.Harmony
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: harmony

finish-args:
  # The whole point of the app: talk to the YouTube Music and Qobuz APIs.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Network audio routing (Route Audio page): pactl talks to PipeWire's pulse
  # socket, so grant it. The runtime ships pactl + module-rtp-recv, so RTP
  # receive-to-a-local-sink works in-sandbox.
  - --socket=pulseaudio
  # Credentials go to the Secret Service via the keyring package. Nothing is
  # written to a host path — import/export uses the file-chooser portal, so no
  # filesystem access is granted here.
  - --talk-name=org.freedesktop.secrets

cleanup:
  - '/include'
  - '/lib/pkgconfig'
  - '/share/man'
  - '*.a'
  - '*.la'
  - '__pycache__'

modules:
  # Pinned Python dependency wheels (generated with flatpak-pip-generator, then
  # every sdist swapped for its manylinux/abi3 wheel so the build needs no
  # compiler, Rust, or network). Regenerate with packaging/flatpak/regen-deps.sh.
  - python3-deps.json

  # roc-toolkit: provides roc-recv for the Route Audio page's ROC transport
  # (forward error correction + adaptive latency -- glitch-free at far lower
  # latency than plain RTP over Wi-Fi). roc-recv runs in-process and outputs to
  # a sink via the PulseAudio socket. Built with network access so roc fetches
  # its own pinned 3rd-party (libuv, openfec, ragel, gengetopt); the SDK already
  # provides libpulse/alsa/speexdsp/sndfile. scons is installed into a throwaway
  # prefix. The cmake-policy patch lets OpenFEC's pre-3.5 CMakeLists configure
  # under modern cmake.
  - name: roc-toolkit
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - |
        set -eux
        T="$PWD/_tools"
        pip3 install --prefix="$T" scons
        export PATH="$T/bin:$PATH"
        export PYTHONPATH="$(ls -d "$T"/lib/python*/site-packages | head -1)"
        python3 -c "p='scripts/scons_helpers/build-3rdparty.py'; s=open(p).read(); s=s.replace('    if not args:\n        args = []\n', '    if not args:\n        args = []\n    args += [\"-DCMAKE_POLICY_VERSION_MINIMUM=3.5\"]\n', 1); open(p,'w').write(s)"
        scons -Q --build-3rdparty=libuv,openfec,ragel,gengetopt --disable-sox --prefix=/app install
    sources:
      - type: archive
        url: https://github.com/roc-streaming/roc-toolkit/archive/refs/tags/v0.4.0.tar.gz
        sha256: 60501dfdc8c0de385898dbd1eb8239d93ef962667ddb064ad796b887a41a1a46

  - name: harmony
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/io.github.marthofdoom.Harmony.desktop
          ${FLATPAK_DEST}/share/applications/io.github.marthofdoom.Harmony.desktop
      - install -Dm644 data/io.github.marthofdoom.Harmony.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.marthofdoom.Harmony.metainfo.xml
      - install -Dm644 data/icons/io.github.marthofdoom.Harmony.svg
          ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.marthofdoom.Harmony.svg
    sources:
      - type: git
        # Public repo. For a local dev build, override with:
        #   flatpak-builder --default-branch=main ... (or point url at a local
        #   checkout). flatpak-builder exports only tracked files, so the venv
        #   and build artifacts never enter the sandbox.
        url: https://github.com/marthofdoom/harmony.git
        branch: main
