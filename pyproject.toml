[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony"
version = "0.6.1"
description = "A cross-service music hub for Linux: sync playlists across YouTube Music and Qobuz, search, discover, and control playback devices — standalone but federatable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "ytmusicapi>=1.10",
    "requests>=2.31",
    "rapidfuzz>=3.14.5",
    "platformdirs>=4.0",
    "keyring>=24.0",
    # Resolves a playable YouTube audio stream URL for play-to-device (the
    # relay). Imported lazily in the YT provider so a minimal install still
    # works — it just can't stream YouTube to a device without this.
    "yt-dlp>=2024.12",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
# LAN mesh discovery (mDNS). Optional + soft-imported in harmony.mesh, so a build
# without it still runs (discovery just disabled). Kept out of core deps so the
# offline Flatpak build (pip --no-index) doesn't require a vendored wheel; the
# container/AUR/.deb install it. Pure-Python.
mesh = ["zeroconf>=0.130"]
# Everything a network server wants (the GHCR/AUR/.deb install target).
server = ["zeroconf>=0.130"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
harmony = "harmony.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the web client's static assets inside the wheel (build-free frontend).
"harmony.web" = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
