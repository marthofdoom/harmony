[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony"
version = "0.5.0"
description = "A cross-service music hub for Linux: sync playlists across YouTube Music and Qobuz, search, discover, and control playback devices — standalone but federatable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "ytmusicapi>=1.10",
    "requests>=2.31",
    "rapidfuzz>=3.0",
    "platformdirs>=4.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
harmony = "harmony.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
